name: Application CI

# Root production build, typecheck, lint, unit tests, corpus, and workbench.
# No production secrets or automatic branch deployments. Integration tests
# have a separate explicit local/test-database entry point.

on:
  # `ready_for_review` is not a default type, and it is here because a pull
  # request opened by a workflow using GITHUB_TOKEN starts no workflow run at
  # all — GitHub refuses, to stop a workflow triggering itself. The types PR
  # that db-types-drift.yml raises arrived with no checks whatsoever, which on
  # a branch protected by four required checks reads as "nothing has gone
  # wrong" rather than "nothing has been run". Those PRs are opened as drafts
  # now, and a person marking one ready is an event from a person, so this is
  # the trigger that finally runs the gate on them.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # The duplicate-run guard below asks whether this commit already passed.
  actions: read

# Keyed on the commit, not just the ref, and deliberately not cancelling.
#
# Grouped by ref alone, a second event on a commit already being tested killed
# the run in flight and started over from zero — observed on this very pull
# request, where marking it ready for review cancelled a run seven minutes and
# twelve seconds in. The run being cancelled was already answering the exact
# question the new event asks, so the guard in the job below never gets a
# successful run to find and the replacement pays full price.
#
# Queued instead: the first run finishes, and the second finds it green and
# skips in seconds. The cost is that a superseded commit's run is no longer
# cancelled by the next push, which spends runner minutes rather than anyone's
# wall clock.
concurrency:
  group: app-ci-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    name: Lint, typecheck, and tests
    runs-on: ubuntu-latest
    # Measured on run 335: fourteen minutes, of which the unit suite was 6m44
    # and the production build 3m54. The suite now runs its files in parallel
    # (see vitest.config.ts), so the build is the long pole. The timeout stays
    # generous — it is here to stop a hung job, not to police the duration.
    timeout-minutes: 30
    steps:
      # A pull request opened as a draft runs this workflow, and marking it
      # ready for review runs it again on the identical commit:
      # `ready_for_review` is a fresh event, not a retry, so a green run does
      # not stop it. Every pull request was paying for two full runs of the
      # same code — fourteen minutes each — and the second one delays the
      # merge it is supposedly gating.
      #
      # The trigger stays. A pull request opened by a workflow using
      # GITHUB_TOKEN starts no run at all, and a person marking it ready is
      # the only event that ever will; that is why `ready_for_review` is in
      # the list above. So the question to ask is not "which event is this"
      # but "has this exact commit already passed" — those bot pull requests
      # have no earlier run and fall through to the real thing.
      #
      # Guarded per step rather than with a job-level `if:`. A job skipped by
      # `if:` reports its check run as `skipped`, and this job is a required
      # check; leaving the job to run and guarding its steps reports a
      # genuine success in seconds instead of asking branch protection to
      # score a skip.
      - name: Has this commit already passed?
        id: prior
        if: github.event_name == 'pull_request'
        # A guard that cannot answer must never be the reason the suite did
        # not run. Failing here leaves `skip` unset, which reads as "run it".
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # A failure here must not skip the suite: default to running.
          count=$(gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/app-ci.yml/runs?head_sha=${SHA}&status=success" \
            --jq '.total_count' 2>/dev/null) || count=0
          case "$count" in ''|*[!0-9]*) count=0 ;; esac
          if [ "$count" -gt 0 ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo "::notice::${SHA} already passed Application CI; skipping the duplicate run."
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: ${{ success() && steps.prior.outputs.skip != 'true' }}

      - uses: actions/setup-node@v4
        if: ${{ success() && steps.prior.outputs.skip != 'true' }}
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        if: ${{ success() && steps.prior.outputs.skip != 'true' }}
        run: npm ci

      # Incremental typecheck state. `npm run typecheck` writes
      # tsconfig.typecheck.tsbuildinfo; restoring it lets tsc skip unchanged
      # files. Keyed on the lock file and the tsconfig so a dependency or
      # compiler-option change starts from a clean build.
      - name: Restore typecheck cache
        if: ${{ success() && steps.prior.outputs.skip != 'true' }}
        uses: actions/cache@v4
        with:
          path: tsconfig.typecheck.tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig*.json') }}-

      # `npm run lint` exits 0 on warnings, so the gate would start green and
      # stay green while warnings piled up. Keep the ceiling at the measured
      # post-remediation count and lower it as remaining warnings are fixed.
      - name: Lint
        if: ${{ !cancelled() && steps.prior.outputs.skip != 'true' }}
        run: npm run lint -- --max-warnings=10

      - name: Typecheck
        if: ${{ !cancelled() && steps.prior.outputs.skip != 'true' }}
        run: npm run typecheck

      - name: Test
        if: ${{ !cancelled() && steps.prior.outputs.skip != 'true' }}
        run: npm test -- --reporter=dot

      - name: Production build
        if: ${{ !cancelled() && steps.prior.outputs.skip != 'true' }}
        run: npm run build:ci

      # Regenerates every estate document and compares it to the golden
      # corpus. Its own step because it renders 45 DOCX files — too slow for the
      # unit suite, and a different kind of check: it fails only when output an
      # attorney has approved changes, and reports unreviewed drift without
      # blocking.
      - name: Golden corpus
        if: ${{ !cancelled() && steps.prior.outputs.skip != 'true' }}
        run: npm run corpus:check

      # The workbench is a second app in the same workspace, so it needs no
      # install of its own — the one `npm ci` above covers both. Its suite is
      # separate because vitest resolves test paths from its own root, and it
      # runs last because the root app is the one currently in production.
      - name: Workbench
        if: ${{ !cancelled() && steps.prior.outputs.skip != 'true' }}
        run: npm run -w apps/workbench verify
