name: Database types drift

# Keeps packages/db-types/src/supabase.generated.ts describing the database it claims to.
#
# The file is generated (`npm run db:types:linked`) and checked in, and nothing
# ever verified it. It went four merged migrations out of date without anyone
# noticing: it still declared `cornerstone_crm_opportunities` and the Twenty
# sync columns months after both were dropped, and knew nothing about
# `matter_stage_history`, `v_matter_stage_totals`, `stage_sla.cumulative_sla_days`
# or `v_lead_list`. Nothing broke, because nearly all database code goes through
# the permissive compatibility `Database` in types/supabase.ts — which is
# exactly why the drift was invisible. The few call sites that do use the real
# generated types (lib/workflowJobs.ts, lib/billing/schedules.ts, the matter-type
# route) were being type-checked against a schema that no longer existed.
#
# WHY THE DATABASE COMPARISON IS NOT ON pull_request. A branch that adds a
# migration is *supposed* to carry types the deployed database does not have
# yet — the migration only applies when it merges. Comparing there would fail
# every schema PR for doing the right thing, which is the same reasoning
# db-migration-drift.yml uses to keep `--strict` off its pull_request run. So
# the PR run is only the credential-free structural check, and the comparison
# against the real database happens on a schedule.
#
# WHY NOT ON push TO main. db-migrate-deploy.yml applies migrations on that
# same event. A types check racing it would report drift that is a few seconds
# old rather than real.
#
# WHY TWO JOBS. Regenerating needs credentials that a development container has
# neither of: `--db-url` and `--local` need Docker, `--linked` and
# `--project-id` need an access token. So the workflow that finds drift can also
# fix it — but only that path may write, and `permissions:` takes no
# expressions, so the writing path is a separate job rather than a conditional
# permission on one.

on:
  # `ready_for_review` is not a default type, and it is here because a pull
  # request opened by a workflow using GITHUB_TOKEN starts no workflow run at
  # all — GitHub refuses, to stop a workflow triggering itself. The types PR
  # this workflow raises arrived with no checks whatsoever, which on a branch
  # protected by four required checks reads as "nothing has gone wrong" rather
  # than "nothing has been run". Those PRs are drafts now, and a person marking
  # one ready is an event from a person, so this is the trigger that finally
  # runs the gate on them.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    # 12:00 UTC on weekdays — early morning ET, matching the other two checks.
    - cron: '0 12 * * 1-5'
  workflow_dispatch:
    inputs:
      open_pr:
        description: 'Regenerate and open a pull request instead of just failing on drift'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: db-types-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  types-drift:
    name: Generated types match the database
    # The regenerate job below covers this same ground when it runs, and would
    # otherwise fail the run it is meant to fix.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.open_pr) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # No `npm ci`: checkSupabaseTypes.mjs and generateSupabaseTypes.mjs import
      # only node builtins, and the CLI comes from setup-cli below.
      - name: Check the checked-in types are generated, not a placeholder
        run: npm run check:db-types

      - name: Flag missing credentials
        if: github.event_name != 'pull_request' && (env.SUPABASE_ACCESS_TOKEN == '' || env.SUPABASE_URL == '')
        run: |
          echo "::warning::Supabase credentials are not set, so the comparison against the database will skip without verifying anything. Add the SUPABASE_URL and SUPABASE_ACCESS_TOKEN repository secrets to enable it."

      # Same reasoning as db-migrate-deploy.yml: read the version npm actually
      # installed rather than the caret range's floor, so the CLI here is the
      # one the repo is pinned to. A different CLI generates a different file,
      # which would read as drift.
      - name: Resolve the pinned CLI version
        id: cli
        if: github.event_name != 'pull_request' && env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_URL != ''
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/supabase']?.version || require('./package.json').devDependencies.supabase.replace(/^[^0-9]*/, '')")
          echo "Using Supabase CLI $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@v1
        if: steps.cli.outputs.version != ''
        with:
          version: ${{ steps.cli.outputs.version }}

      - name: Link the project
        if: steps.cli.outputs.version != ''
        run: |
          ref=$(printf '%s' "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*$#\1#')
          case "$ref" in
            "" | *[!a-z0-9]* )
              echo "::error::Could not read a project ref out of SUPABASE_URL. Expected https://<ref>.supabase.co."
              exit 1
              ;;
          esac
          supabase link --project-ref "$ref"

      - name: Regenerate types from the database
        if: steps.cli.outputs.version != ''
        run: npm run db:types:linked

      - name: Fail on drift, printing it
        if: steps.cli.outputs.version != ''
        run: |
          if git diff --quiet -- packages/db-types/src/supabase.generated.ts; then
            echo "Generated types match the database."
            exit 0
          fi
          echo "::group::Drift"
          git --no-pager diff --stat -- packages/db-types/src/supabase.generated.ts
          git --no-pager diff -- packages/db-types/src/supabase.generated.ts | head -400
          echo "::endgroup::"
          echo "::error::packages/db-types/src/supabase.generated.ts does not match the database. Re-run this workflow from the Actions tab with 'open_pr' checked and it will raise the pull request itself."
          exit 1

  regenerate:
    name: Regenerate the types and open a pull request
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.open_pr }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Fails rather than warns: this path was asked for explicitly, and one
      # that quietly regenerates nothing would look like "no drift".
      - name: Require credentials
        run: |
          missing=
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_URL" ] || missing="$missing SUPABASE_URL"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — types cannot be regenerated. Add them under Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi

      - name: Resolve the pinned CLI version
        id: cli
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/supabase']?.version || require('./package.json').devDependencies.supabase.replace(/^[^0-9]*/, '')")
          echo "Using Supabase CLI $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ steps.cli.outputs.version }}

      - name: Link the project
        run: |
          ref=$(printf '%s' "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*$#\1#')
          case "$ref" in
            "" | *[!a-z0-9]* )
              echo "::error::Could not read a project ref out of SUPABASE_URL. Expected https://<ref>.supabase.co."
              exit 1
              ;;
          esac
          supabase link --project-ref "$ref"

      - name: Regenerate types from the database
        run: npm run db:types:linked

      - name: Open a pull request with the regenerated types
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- packages/db-types/src/supabase.generated.ts; then
            echo "Generated types already match the database; nothing to open."
            exit 0
          fi
          git --no-pager diff --stat -- packages/db-types/src/supabase.generated.ts
          branch="chore/regenerate-supabase-types-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          # Only the generated file: never a stray change from the run.
          git add packages/db-types/src/supabase.generated.ts
          git commit -m 'Regenerate Supabase types from the database'
          git push -u origin "$branch"

          # The branch is pushed before this, so a repo that forbids Actions
          # from opening pull requests loses the work only if the failure is
          # illegible. Name the setting and print the link rather than exiting
          # on a bare GraphQL error.
          # DRAFT, DELIBERATELY. A pull request opened with GITHUB_TOKEN starts
          # no workflow run, so this one arrives with none of the four required
          # checks — and a branch protection whose checks never report is not a
          # gate. `enforce_admins` is off, so the person who can merge it is
          # also the person allowed to bypass, and what they would see is a
          # pull request with nothing red on it. A draft cannot be merged by
          # anyone, and marking it ready is an event from a person, which does
          # start the workflows.
          if ! gh pr create \
            --draft \
            --base "${GITHUB_REF_NAME}" \
            --head "$branch" \
            --title 'Regenerate Supabase types from the database' \
            --body-file .github/pr-bodies/regenerated-types.md
          then
            echo "::error::Regenerated types are pushed to '$branch', but the pull request could not be opened. If the reason above is \"GitHub Actions is not permitted to create or approve pull requests\", enable Settings → Actions → General → Workflow permissions → 'Allow GitHub Actions to create and approve pull requests'. Until then, open it here: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${GITHUB_REF_NAME}...${branch}?expand=1"
            exit 1
          fi
