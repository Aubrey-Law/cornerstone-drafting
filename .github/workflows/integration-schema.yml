name: Tests that need the real migrated schema

# Three of the four defects that reached production on the native e-signature
# path were invisible to the whole local gate, and one of them is the reason
# this job exists: createDocumentRequest wrote `agreement_id:
# crypto.randomUUID()` into a column declared `references
# engagement_agreements(id)`. That insert could not succeed on any input. The
# engine was incapable of creating a signing session from the day it shipped,
# and thousands of unit tests passed over it, because those tests mock
# getAdminClient() and a mock enforces no foreign keys.
#
# Nor would the existing integration suite have caught it. Those five files run
# by hand against tests/integration/fixtures/firm-remediation.sql — a
# deliberately minimal synthetic catalog with two foreign keys in total and no
# e-sign tables at all. Only the real migrations carry the constraint, so this
# job runs the tests that need them (tests/integration/schema/, under
# vitest.schema.config.ts) and only those. The fixture-catalog suite keeps its
# own documented procedure and is untouched here.
#
# No stored secrets. `supabase start` brings up a local stack, applies
# supabase/migrations itself, and prints its own keys; the job reads them out of
# `supabase status` and throws them away with the runner. The same property that
# made esign-anchor-probe.yml safe to add.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Only where the answer could change. Standing up the stack is slow, and a
    # check that is slow everywhere gets ignored.
    paths:
      - 'lib/esign/**'
      - 'lib/engagement/**'
      - 'supabase/migrations/**'
      - 'tests/integration/schema/**'
      - 'tests/integration/setup.ts'
      - 'tests/support/verificationEnvironment.ts'
      - 'vitest.schema.config.ts'
      - '.github/workflows/integration-schema.yml'
  schedule:
    # 12:40 UTC on Mondays — after the anchor probe at 12:20, so a red Monday
    # morning arrives as one thing at a time.
    - cron: '40 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  # The duplicate-run guard below reads this workflow's own run history.
  actions: read

concurrency:
  # Keyed on the commit, not the ref, and it does not cancel. Keyed on the ref,
  # a new push kills an in-flight run on the older commit — the "continuously
  # restart" behaviour #493 removed from app-ci.yml. A genuine same-SHA
  # duplicate is what the guard handles instead, and far more cheaply.
  group: integration-schema-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  integration:
    name: Tests that need the real migrated schema
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # Standing this stack up costs ~2m30 of the job's ~3m30. `ready_for_review`
      # is a fresh event, not a retry, so without this the job pays all of it
      # again to re-reach a conclusion it already had. Same guard as
      # app-ci.yml's, which is where this pattern is already proven.
      - name: Has this commit already passed?
        id: prior
        if: github.event_name == 'pull_request'
        # A guard that cannot answer must never be the reason the suite did
        # not run. Failing here leaves `skip` unset, which reads as "run it".
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # A failure here must not skip the suite: default to running.
          count=$(gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/integration-schema.yml/runs?head_sha=${SHA}&status=success" \
            --jq '.total_count' 2>/dev/null) || count=0
          case "$count" in ''|*[!0-9]*) count=0 ;; esac
          if [ "$count" -gt 0 ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo "::notice::${SHA} already passed the schema tests; skipping the duplicate run."
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: ${{ success() && steps.prior.outputs.skip != 'true' }}
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        if: ${{ success() && steps.prior.outputs.skip != 'true' }}

      # Pinned rather than latest: the CLI decides which Postgres image the
      # stack runs, and the point of this job is that the schema behaves the way
      # production's does.
      - uses: supabase/setup-cli@v1
        if: ${{ success() && steps.prior.outputs.skip != 'true' }}
        with:
          version: 2.114.0

      - name: Start the local stack
        if: ${{ success() && steps.prior.outputs.skip != 'true' }}
        run: supabase start

      # `supabase status -o env` prints the generated keys as shell assignments.
      # They are per-run and local to this container; masking them keeps them
      # out of the log even so.
      #
      # The names are checked rather than trusted, because this workflow was
      # written in a container whose egress proxy blocks public.ecr.aws, so
      # `supabase start` could not run there and the names came from memory. The
      # first CI run confirmed all four; the check stays as a guard against the
      # CLI renaming one, which would otherwise export an empty string and
      # surface later as an unhelpful connection error.
      - name: Point the suite at the local stack
        if: ${{ success() && steps.prior.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          missing=()
          for name in API_URL DB_URL SERVICE_ROLE_KEY ANON_KEY; do
            # An `if`, not `[ ... ] && ...`: under `set -e` the `&&` form exits
            # the step when the test is false, which is the case where all is
            # well.
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::supabase status -o env did not provide: ${missing[*]}"
            echo 'Names it did provide:'
            supabase status -o env | sed 's/=.*/=<redacted>/'
            exit 1
          fi
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "::add-mask::$ANON_KEY"
          {
            echo "INTEGRATION_SUPABASE_URL=$API_URL"
            echo "INTEGRATION_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "INTEGRATION_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "INTEGRATION_DATABASE_URL=$DB_URL"
          } >> "$GITHUB_ENV"

      - name: Run the schema tests
        if: ${{ success() && steps.prior.outputs.skip != 'true' }}
        run: npm run test:schema

      - name: Stack logs on failure
        if: failure()
        run: supabase status || true

      - name: Stop the local stack
        if: always()
        run: supabase stop --no-backup || true
